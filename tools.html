<h1>Tools</h1>

Convert a PDF into a png   (here 1k dpi)
<pre>
 pdftoppm -png -r 1000 PosterIpe-Distances.pdf PosterIpe-Distances-1k
</pre>

<BR>

Convert avi (Camstudio) into mp4 with ffmpeg
<pre>
ffmpeg -i PowerMEB8.avi -c:v libx264 -c:a aac PowerMEBLPtype8.mp4
</pre>
